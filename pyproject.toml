[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uncover-extract"
version = "0.3.0"
description = "Per-instance VDB coverage facts and complete uncovered point reports using Verdi NPI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
uncover-extract = "uncover_extract.cli:main"

[tool.setuptools.packages.find]
include = ["uncover_extract*"]
