[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uncover-extract"
version = "0.2.0"
description = "Synopsys VDB coverage facts and RTL instance differences using Verdi NPI"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
uncover-extract = "uncover_tool.cli:main"

[tool.setuptools.packages.find]
include = ["uncover_tool*"]
